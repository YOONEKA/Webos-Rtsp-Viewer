name: Build webOS IPK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  package-ipk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: for f in *.zip; do unzip -o "$f"; done

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install webOS CLI (ares-package)
        run: npm install -g @webosose/ares-cli

      - name: Stage Web App & Package .ipk
        working-directory: RtspDreamWebOS
        run: |
          mkdir -p build/webapp dist
          cp appinfo.json index.html styles.css app.js icon.png largeIcon.png build/webapp/
          ares-package build/webapp service -o dist

      - name: Upload webOS .ipk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: RtspDreamViewer-webos-ipk
          path: RtspDreamWebOS/dist/*.ipk
